id: ms.skill.market_research
name: Market Research
version: 0.1.0
description: >
  Consume normalized Product Marketing Context, define research questions,
  structure available market evidence, detect gaps, and prepare an
  evidence-aware research output — without commercial verdicts or external
  connector execution.
owner: Marketsynth Platform
source: platform_native
license: Proprietary
status: candidate
output_contract_type: research
capabilities:
  - research_question_definition
  - market_definition_structuring
  - market_structure_analysis
  - market_signal_inventory
  - demand_signal_structuring
  - customer_signal_structuring
  - pricing_signal_structuring
  - channel_signal_structuring
  - competitor_signal_structuring
  - source_inventory
  - evidence_gap_detection
  - observation_inference_separation
  - research_coverage_assessment
  - evidence_quality_assessment
  - research_status_assessment
activation_conditions:
  runtime_compatibility:
    - operator_dry_run
    - assistant_explicit_run
  requires_governed_context: true
  executable: false
required_inputs:
  schema_ref: schemas/input.schema.json
output_schema:
  schema_ref: schemas/output.schema.json
required_evidence:
  classes:
    - user_statement
    - market_source
    - competitor_source
    - demand_signal
    - pricing_signal
    - audience_signal
    - assumption
    - inference
  rules:
    - id: source_observation_inference_chain
      description: >
        Every significant finding must separate source, observation, inference,
        and confidence — no source-to-confident-conclusion shortcuts.
    - id: verified_requires_source
      description: Verified findings require source_reference.
    - id: no_commercial_verdict
      description: Research output must not issue proceed/stop/viable/unviable verdicts.
    - id: no_autonomous_web_research
      description: Skeleton package does not fetch external sources autonomously.
dependencies:
  declared_future_dependencies:
    - id: ms.skill.product_marketing_context
      relationship: required_dependency
      note: Upstream normalized context — required for valid research input.
    - id: ms.skill.competitor_analysis
      relationship: declared_future_dependency
      note: Downstream consumer — not a runtime trigger in SKILL-02.2.
allowed_tools: []
approval_policy:
  analysis_preparation:
    external_side_effects: false
    approval_required: false
  verdict_presentation:
    external_side_effects: false
    approval_required: false
  launch_or_execution_transition:
    approval_required: true
    note: Human approval required before launch, spend, or publication.
  paid_or_write_actions:
    approval_required: true
  publication:
    governed_by: native_publication_flow
    skill_bypass_allowed: false
tenant_scope: global
quality_threshold:
  eval_required_before_active: true
  minimum_eval_cases: 1
  current_state: skeleton_only
known_limitations:
  - Non-executable candidate package — no runtime loader in SKILL-02.2.
  - Does not autonomously search the web or invoke Firecrawl, XmlRiver, or Playwright.
  - Does not issue commercial viability verdicts — research_status only.
  - Does not replace CWF.1 research workflows.
  - No connector or tool permissions granted.
test_suite:
  manifest: tests/eval_manifest.yaml
  backend_tests: tests/test_skill_02_2_market_research.py
provenance:
  origin: platform_native
  methodology:
    - Internal Marketsynth market research evidence structuring
    - Informed by SKILL-R0.1 audit MS-SKILL-002 (Market Research)
  external_methodology_references:
    - audit_card: docs/research/skills/candidates/02-market-research.md
      reuse: methodology_only
      license: MIT
      note: No direct external Skill installation or executable content reuse.
  external_code_dependency: false
  direct_external_skill_install: false
  audit_research_id: MS-SKILL-002
runtime_compatibility:
  - operator_dry_run
  - assistant_explicit_run
knowledge_scopes:
  - market_research
  - research_source_collection
network_policy:
  default: deny
  allowed_hosts: []
  allowed_connectors_only: true
script_policy:
  enabled: false
  reason: SKILL-02.2 skeleton — scripts forbidden.
resource_limits:
  max_package_size_mib: 10
  max_skill_md_kib: 256
